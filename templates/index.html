<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExplorerAI</title>
    <!-- Cargador Online Oficial de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b141a;
            color: #ffffff;
        }

        header {
            background-color: #111b21;
            padding: 15px 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .perfil {
            margin-bottom: 12px;
        }

        .perfil h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #00ffaa;
        }

        .perfil p {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #aebac1;
        }

        .controles {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            background-color: #202c33;
            border: 1px solid #374248;
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ffaa;
        }

        button {
            background-color: #00aaff;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #0088cc;
        }

        button.btn-diario {
            background-color: #00ffaa;
            color: #0b141a;
        }

        button.btn-diario:hover {
            background-color: #00cc88;
        }

        #map {
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 400px;
        }

        #diario {
            display: none;
            background-color: #111b21;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            border-top: 2px solid #374248;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }

        .leaflet-popup-content-wrapper {
            background-color: #111b21 !important;
            color: #fff !important;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .leaflet-popup-tip {
            background-color: #111b21 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="perfil">
            <h2>🧭 ExplorerAI</h2>
            <p>Nivel 1 | XP: 0</p>
        </div>

        <div class="controles">
            <input type="text" id="intencion" placeholder="misterio, bosque, aventura...">
            <button onclick="generarAnomalias()">Generar Anomalías</button>
            <button class="btn-diario" onclick="cargarHallazgos()">Diario</button>
        </div>
    </header>

    <div id="map"></div>
    <div id="diario"></div>

    <!-- Script Oficial Online e Inalterado de Leaflet -->
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/static/js/app.js"></script>

</body>
</html>
