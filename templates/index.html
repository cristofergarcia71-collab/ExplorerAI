<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ExplorerAI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

<div class="panel">

    <h1>🧭 ExplorerAI</h1>

    <div id="nivel">
        Nivel 1
    </div>

    <div id="xp">
        XP: 0
    </div>

    <div class="xp-bar">
        <div
        class="xp-fill"
        id="xpFill">
        </div>
    </div>

    <div id="objetivo">

        Sin objetivo seleccionado

    </div>

    <input
    id="intencion"
    placeholder="misterio, bosque, aventura...">

    <button onclick="generarAnomalias()">
        Generar Anomalías
    </button>

    <button onclick="cargarHallazgos()">
        Diario
    </button>

</div>

<div id="map"></div>

<div id="diario"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
